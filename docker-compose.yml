services:
  feasthub-db:
    image: mysql:8.0
    container_name: feasthub-mysql
    restart: always
    environment:
      MYSQL_DATABASE: feasthub_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  feasthub-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feasthub-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://feasthub-db:3306/feasthub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
    ports:
      - "8080:8080"
    depends_on:
      - feasthub-db

  feasthub-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: feasthub-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - feasthub-backend

volumes:
  mysql_data:
